# Auto-grader workflow for the PUBLIC starter repo.
# Secret tests are fetched at runtime from the private repo Ce1lo/rest-api-grader
# using the GRADER_PAT secret. See SETUP.md in the grader repo (team only).
#
# IMPORTANT: pull_request_target (not pull_request) so fork PRs can read
# GRADER_PAT. This file runs the base-repo workflow; student code is untrusted.

name: Auto grade assignment

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout student PR code (untrusted, for testing only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install submission dependencies
        run: npm ci || npm install

      - name: Fetch secret grader (trusted)
        uses: actions/checkout@v4
        with:
          repository: Ce1lo/rest-api-grader
          token: ${{ secrets.GRADER_PAT }}
          path: .grader
          persist-credentials: false

      - name: Run secret grader
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/grading_${{ github.event.pull_request.number }}
          SUBMISSION_DIR: ${{ github.workspace }}
          GRADE_OUTPUT: ${{ github.workspace }}/grade_report.json
          GRADE_SUMMARY: ${{ github.workspace }}/grade_summary.md
        run: |
          if ! node .grader/grader/run.js > "$RUNNER_TEMP/grader.log" 2>&1; then
            echo 'He thong cham gap su co. Xem log noi bo cua nguoi quan ly.' > grade_summary.md
            exit 1
          fi

      - name: Prepare email when grading did not start
        if: always()
        run: |
          if [ ! -s grade_summary.md ]; then
            echo 'He thong cham chua hoan tat. Kiem tra Actions cho PR nay.' > grade_summary.md
          fi

      - name: Email private result to owner
        if: always()
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: lamtoan185@gmail.com
          password: ${{ secrets.GRADER_MAIL_APP_PASSWORD }}
          subject: 'Ket qua cham PR #${{ github.event.pull_request.number }}'
          to: lamtoan185@gmail.com
          from: lamtoan185@gmail.com
          body: file://grade_summary.md
          html_body: file://grade_summary.md
          convert_markdown: true
